name: Doctor PDF — Weekly AI Report

on:
  schedule:
    - cron: '0 5 * * 5'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests google-api-python-client google-auth

      - name: Generate Weekly Report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/summary.md
        run: python generate_report.py

      - name: Commit report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Doctor PDF Bot"
          git add reports/ || true
          git diff --staged --quiet || git commit -m "Weekly report $(date +%Y-%m-%d)"
          git push || true
