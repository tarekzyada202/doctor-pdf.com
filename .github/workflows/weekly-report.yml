name: Doctor PDF — Weekly AI Report

on:
  schedule:
    # كل جمعة الساعة 8 صباحاً (UTC+3 = 5 UTC)
    - cron: '0 5 * * 5'
  workflow_dispatch: # تقدر تشغله يدوياً أي وقت

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate Weekly Report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          python3 << 'PYEOF'
          import anthropic
          import requests
          import json
          import os
          from datetime import datetime, timedelta

          client = anthropic.Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])

          # ── جمع بيانات الموقع ──
          def check_site():
              results = {}
              tools = [
                  'compress-pdf', 'stamp-pdf', 'rotate-pdf', 'merge-pdf',
                  'split-pdf', 'sign-pdf', 'protect-pdf', 'watermark-pdf',
                  'image-to-pdf', 'pdf-to-image', 'extract-text',
                  'convert-image', 'remove-background'
              ]
              working = []
              broken = []
              for tool in tools:
                  try:
                      r = requests.get(f'https://doctor-pdf.com/{tool}.html', timeout=10)
                      if r.status_code == 200:
                          working.append(tool)
                      else:
                          broken.append(f'{tool} (HTTP {r.status_code})')
                  except Exception as e:
                      broken.append(f'{tool} (Error: {str(e)[:30]})')
              results['working'] = working
              results['broken'] = broken
              results['total'] = len(tools)
              results['uptime_pct'] = round(len(working) / len(tools) * 100, 1)
              return results

          # ── فحص المنافسين ──
          def check_competitors():
              competitors = {
                  'ilovepdf.com': 'ilovePDF',
                  'smallpdf.com': 'Smallpdf',
                  'pdf24.org': 'PDF24',
                  'sejda.com': 'Sejda',
                  'revpdf.com': 'RevPDF'
              }
              comp_data = []
              for domain, name in competitors.items():
                  try:
                      r = requests.get(f'https://{domain}', timeout=10)
                      comp_data.append(f'{name}: Online (HTTP {r.status_code})')
                  except:
                      comp_data.append(f'{name}: Unreachable')
              return comp_data

          # ── تشغيل الفحوصات ──
          print("Checking site status...")
          site_data = check_site()

          print("Checking competitors...")
          comp_data = check_competitors()

          today = datetime.now().strftime('%Y-%m-%d')
          week_num = datetime.now().isocalendar()[1]

          # ── Claude يكتب التقرير ──
          print("Generating AI report...")

          prompt = f"""أنت مستشار خبير في تطوير مواقع PDF Tools. اكتب تقرير أسبوعي احترافي لموقع Doctor PDF.

          == بيانات هذا الأسبوع ==
          التاريخ: {today}
          أسبوع رقم: {week_num}

          == حالة الموقع ==
          الأدوات الشغالة ({len(site_data['working'])}/{site_data['total']}): {', '.join(site_data['working'])}
          الأدوات المعطلة: {', '.join(site_data['broken']) if site_data['broken'] else 'لا يوجد ✅'}
          نسبة الـ Uptime: {site_data['uptime_pct']}%

          == حالة المنافسين ==
          {chr(10).join(comp_data)}

          == معلومات الموقع ==
          - الموقع: doctor-pdf.com
          - 13 أداة PDF مجانية 100% browser-based
          - اللغات: عربي + إنجليزي
          - الاستضافة: Cloudflare Pages
          - المرحلة الحالية: بناء SEO وزيادة الزيارات

          اكتب التقرير بالعربية بالأقسام التالية:
          1. ملخص الأسبوع (3 أسطر)
          2. حالة الموقع والأدوات
          3. تحليل المنافسين (ما الجديد عندهم؟)
          4. أولويات الأسبوع القادم (3 مهام محددة وقابلة للتنفيذ)
          5. نصيحة استراتيجية واحدة مهمة

          اجعل التقرير عملياً ومباشراً — لا كلام عام.
          """

          message = client.messages.create(
              model="claude-sonnet-4-20250514",
              max_tokens=1500,
              messages=[{"role": "user", "content": prompt}]
          )

          report_text = message.content[0].text

          # ── حفظ التقرير ──
          report_filename = f'reports/weekly-report-{today}.md'
          os.makedirs('reports', exist_ok=True)

          with open(report_filename, 'w', encoding='utf-8') as f:
              f.write(f"# Doctor PDF — تقرير أسبوعي {today}\n\n")
              f.write(f"**Uptime:** {site_data['uptime_pct']}% | ")
              f.write(f"**أدوات شغالة:** {len(site_data['working'])}/{site_data['total']}\n\n")
              f.write("---\n\n")
              f.write(report_text)
              f.write("\n\n---\n")
              f.write(f"*تم الإنشاء تلقائياً بواسطة Claude AI — {today}*\n")

          print(f"Report saved: {report_filename}")
          print("\n" + "="*50)
          print(report_text)
          print("="*50)

          # ── حفظ ملخص للـ step summary ──
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'w') as f:
              f.write(f"# 📊 Doctor PDF — Weekly Report {today}\n\n")
              f.write(f"**Uptime:** {site_data['uptime_pct']}% ")
              f.write(f"| **Tools working:** {len(site_data['working'])}/{site_data['total']}\n\n")
              if site_data['broken']:
                  f.write(f"⚠️ **Issues:** {', '.join(site_data['broken'])}\n\n")
              f.write("---\n\n")
              f.write(report_text)

          PYEOF

      - name: Commit report to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Doctor PDF Bot"
          git add reports/ || true
          git diff --staged --quiet || git commit -m "📊 Weekly report $(date +%Y-%m-%d)"
          git push || true

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.REPORT_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.REPORT_EMAIL }}
          from: Doctor PDF Bot <${{ secrets.REPORT_EMAIL }}>
          subject: "📊 Doctor PDF — تقرير أسبوعي $(date +%Y-%m-%d)"
          body: |
            مرحباً طارق،

            التقرير الأسبوعي لـ Doctor PDF جاهز!

            يمكنك مشاهدته كاملاً هنا:
            https://github.com/tarekzyada202/doctor-pdf.com/actions

            في مجلد reports/ في الـ repository.

            Doctor PDF Bot 🤖
